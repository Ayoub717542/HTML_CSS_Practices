<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
            text-align: center;
            margin: 0;
            padding: 20;
            background-color: #f5f5f5;
        }
        .gallery{
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            max-width: 900px;
            margin:auto;
        }
        .gallery-item{
            flex: 1 1 clac(25% - 10px);
            max-width: calc(25% - 10%);
            overflow: hidden;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            object-fit: cover;
            object-fit: contain;
            cursor: pointer;
            transition: transform 0.3s;
            
        }
        .gallery-item img{
            width: 100%;
            height: 100%;
            display: block;
            object-fit: cover; 
            transition: transform 0.3s;
        }
        .gallery-item:hover img {
        transform: scale(1.2);
    }
    .modal {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    overflow: auto;
    background-color: rgba(0,0,0,0.8);
}
   .modal-content {
        margin: auto;
        display: block;
        max-width: 90%;
        max-height: 80%;
        border-radius: 10px;
    }
    </style>
    <h1>Gallery</h1>
    <div class="gallery">
         <div class="gallery-item"><img src="./pexels-energepic-com-27411-110469.jpg" alt="Image 1" loading="lazy">></div>
         <div class="gallery-item"><img src="./pexels-freestockpro-2070485.jpg" alt="Image 2"></div>
         <div class="gallery-item"><img src="./pexels-janodude-110686.jpg " alt="Image 2"></div>
         <div class="gallery-item"><img src="./pexels-m-venter-792254-1659438.jpg" alt="Image 3"></div>
         <div class="gallery-item"><img src="./pexels-tobiasbjorkli-1887624.jpg" alt="Image 4"></div>
         <div class="gallery-item"><img src="./pexels-souvenirpixels-414612.jpg" alt="Image 5"></div>
         <div class="gallery-item"><img src="./pexels-eberhardgross-1624496.jpg" alt="Image 6"></div>
    </div>

<div id="myModal" class="modal">
    <span class="close">&times;</span>
    <img class="modal-content" id="modal-img">
</div>
<script>
const modal = document.getElementById('myModal');
const modalImg = document.getElementById('modal-img')
const closeBtn = document.getElementsByClassName('close')[0];

    document.querySelectorAll('.gallery-item img').forEach(img => {
        img.addEventListener('click', () => {
            modal.style.display = 'block';
            modalImg.src = img.src;
        });
    });
        closeBtn.onclick = function() {
        modal.style.display = "none";
    }

    modal.onclick = function(e) {
        if (e.target === modal) {
            modal.style.display = "none";
        }
    }

</script>
</body>
</html>
