<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <style>

        *{
            margin: 0;
            padding: 0;
        }
        body{
            background-color: aliceblue;
             
        }
        .card{
    display: flex;
    justify-self: center;
    flex-direction: column;
    align-items: center;
    border: 1px solid black;
    padding: 16px;
    width: 450px; 
    box-sizing: border-box; 
    gap: 8px; 
    margin-top: 10%;
    background-color:lightblue;
    border-radius: 10px;
    
        }
        form{
            padding: 16px 15px;
        
        }
        input[type=text],input[type=password]{
        width: 100%;
        padding: 12px;
        margin: 10px 0;
        box-sizing: border-box;
    }
        h2{
            display: flex;
            justify-content: center;
            padding: 5px;
        }
        button{
            font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 5px;
            background-color: azure;
            border: 1px solid grey;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
        }
        
        .Password{
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 10px;

        }
    </style>

<div class="card">
    <form action="#">
        <h2>Connection Form</h2>
        <div>
        <label for="email">email</label>
        <input type="text" name="email" placeholder="EX:email23@gmail.com" required>
        </div>
           <div>
        <label for="mot_de_passe">mot de passe</label>
        <input type="password" name="mot_de_passe" placeholder="Mot De Passe" required>
        </div>
        <div><button type="submit"><h2>Loging</h2></button></div>
        <div class="Password">
            <a href="#">Mot de passe oublié ?</a>
        </div>
         
    </form>
    </div>
</body>
</html>
